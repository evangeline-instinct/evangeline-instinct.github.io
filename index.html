<style>
  :root { --ink: #111; --muted: #888; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fff;
    color: var(--ink);
    font: 400 18px/1.7 "Newsreader", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 14vh 20px 10vh; }
  main.unlocked { max-width: 860px; padding-top: 6vh; }
  h1 { font-size: 18px; font-weight: 400; margin: 0; }
  .site { margin: 0 0 24px; }
  .pond-wrap { margin-bottom: 44px; }
  #pond { display: block; width: 100%; height: 330px; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-tap-highlight-color: transparent; }
  @media (max-width: 520px) { #pond { height: 270px; } }
  h2 { font-size: 18px; font-weight: 400; color: var(--muted); margin: 0; }
  section { margin: 0 0 32px; }
  p { margin: 0; }
  a { color: inherit; text-decoration: underline; text-decoration-color: #ccc; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  a:hover { text-decoration-color: var(--ink); }

  /* enter domain gate */
  #enter-domain { display: inline-block; margin-top: 8px; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; color: inherit; text-decoration: underline; text-decoration-color: #ccc; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  #enter-domain:hover { text-decoration-color: var(--ink); }
  #gate-form { margin-top: 16px; display: none; }
  #gate-form.open { display: block; }
  #gate-form input {
    font: inherit; color: inherit; background: #fff;
    border: 1px solid #ccc; border-radius: 4px; padding: 6px 10px; width: min(260px, 70%);
  }
  #gate-form input:focus { outline: none; border-color: var(--ink); }
  #gate-form button { font: inherit; background: none; border: 0; padding: 0 0 0 10px; cursor: pointer; color: inherit; text-decoration: underline; text-decoration-color: #ccc; text-underline-offset: 3px; }
  #gate-form button:hover { text-decoration-color: var(--ink); }
  #gate-msg { margin-top: 10px; color: var(--muted); font-size: 16px; min-height: 1.6em; }

  /* top nav: akshatb.com style - one centred line, dot separators, fine rule */
  .topnav {
    display: none; flex-wrap: wrap; justify-content: center; align-items: baseline;
    gap: 0.2rem 0; margin: 0 0 2.6rem; padding: 0 0 1rem;
    border-bottom: 1px solid rgba(17,17,17,0.18);
  }
  main.unlocked .topnav { display: flex; }
  .topnav a { font-size: 1rem; white-space: nowrap; color: inherit; text-decoration: none; cursor: pointer; }
  .topnav a:hover { text-decoration: underline; text-decoration-color: rgba(17,17,17,0.45); text-decoration-thickness: 1px; text-underline-offset: .15em; }
  .topnav a:not(:last-child)::after { content: "\00b7"; display: inline-block; margin: 0 0.7rem; opacity: 0.55; }
  .topnav a.current { text-decoration: underline; text-decoration-color: var(--ink); text-underline-offset: .15em; }

  .frame-wrap { display: none; }
  .frame-wrap.active { display: block; }
  .frame-wrap iframe { display: block; width: 100%; height: 72vh; border: 0; background: #fff; }
  #view-home { display: none; }
  #view-home.active { display: block; }
</style>
</head>
<body>
<main id="main">
  <nav class="topnav" id="topnav">
    <a data-view="home" class="current">Home</a>
    <a data-view="resources">Resources</a>
    <a data-view="todo">To - Do</a>
    <a data-view="reading">Reading</a>
  </nav>

  <div id="gate">
    <h1>Akshat's Instinct</h1>
    <p class="site"><a href="mailto:akshatb@mail.instinct.com">akshatb@mail.instinct.com</a></p>
    <button id="enter-domain" type="button">Enter Domain</button>
    <form id="gate-form" autocomplete="off">
      <input id="gate-input" type="password" placeholder="password" aria-label="password">
      <button type="submit">enter</button>
      <p id="gate-msg"></p>
    </form>
  </div>

  <div id="view-home">
    <section class="pond-wrap">
      <canvas id="pond" role="img" aria-label="An ASCII koi pond. Tap to feed the koi."></canvas>
    </section>
    <section>
      <h2>Find me</h2>
      <p>
        <a href="mailto:akshatb@mail.instinct.com">Email</a>,
        <a href="https://github.com/evangeline-instinct">GitHub</a>
      </p>
    </section>
  </div>

  <div class="frame-wrap" id="view-resources"></div>
  <div class="frame-wrap" id="view-todo"></div>
  <div class="frame-wrap" id="view-reading"></div>
</main>
<script src="pond.js"></script>
<script>
/* The lock is the same pattern as akshatb.com/private: the password is stretched into a key
   (PBKDF2, 2,000,000 rounds) and the page's private config is encrypted with it (AES-GCM).
   Nothing private can be read from this file without the password; a wrong password fails
   decryption. Once unlocked, the key is kept in this tab only (sessionStorage). */
var SALT = '9ZUEdBrs3ixk/c+WSM846w==', ITER = 2000000, KEY = 'domain.key';
var CONTENT = 't8sTctIx4Lv/DCZT.Ik3Yi/G0VN0B2NmNH/O+c1BMYR82KaDUknw4kTsJ4oX8z1rlTaYNRuDWW0InizQ6yWh9QVWhPYNmkszs/2geJmoIrw0PiSstxe79wlQgTDxnQ7CdJYPgzAvYJw/7Ws8IxVXkZyOn55u1aeDjP/4yghBJo9PYjwdIF/X/pQRqsUsxxdegsdou48fzuKDmwa4Y7AwpOTDnu9IxKpaOM25I0jiKF1Dx2/PmDS5YIpM/yaSCRbG6DLqLa9rx8vVb6hRi2Om1bQzksDX510mifGDOw4Q4o82/dVXuVnV10TTSMTuQdTfP8ckXGXTaAAf8mM37bAXMuvjivvNJaLe2ON3EZDQNGTDJpcEyBrRsHk3Zf6ACAV5MIMdQrqvGPbl6RylGPVMptRDZ21GX7DpkLD4geW3NL5/E9CzxFVrn+J+pkXRak3yvSVdNFxwC';
(function () {
  var main = document.getElementById("main");
  var gate = document.getElementById("gate");
  var home = document.getElementById("view-home");
  var enterBtn = document.getElementById("enter-domain");
  var form = document.getElementById("gate-form");
  var input = document.getElementById("gate-input");
  var msg = document.getElementById("gate-msg");
  var cfg = null;

  function b64(u8) { var s = ''; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
  function unb64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

  function stretch(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) {
        return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unb64(SALT), iterations: ITER, hash: 'SHA-256' }, base, 256);
      }).then(function (bits) { return new Uint8Array(bits); });
  }
  function decrypt(raw, blob) {
    var p = String(blob).split('.');
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']).then(function (key) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(p[0]) }, key, unb64(p[1]));
    }).then(function (pt) { return JSON.parse(new TextDecoder().decode(pt)); });
  }

  function frame(view, url) {
    var wrap = document.getElementById("view-" + view);
    if (!wrap.dataset.loaded) {
      var f = document.createElement("iframe");
      f.src = url;
      f.setAttribute("title", view);
      wrap.appendChild(f);
      wrap.dataset.loaded = "1";
    }
  }

  function show(view) {
    var views = { home: home, resources: document.getElementById("view-resources"), todo: document.getElementById("view-todo"), reading: document.getElementById("view-reading") };
    Object.keys(views).forEach(function (k) { views[k].classList.toggle("active", k === view); });
    var links = document.querySelectorAll(".topnav a");
    links.forEach(function (a) { a.classList.toggle("current", a.dataset.view === view); });
    if (view !== "home" && cfg) frame(view, cfg[view]);
    if (location.hash !== "#/" + view) history.replaceState(null, "", "#/" + view);
    window.dispatchEvent(new Event("resize"));
  }

  function unlock(raw, config) {
    cfg = config;
    try { sessionStorage.setItem(KEY, b64(raw)); } catch (e) {}
    gate.style.display = "none";
    main.classList.add("unlocked");
    var target = (location.hash || "").replace("#/", "");
    show(["home", "resources", "todo", "reading"].indexOf(target) >= 0 ? target : "home");
  }

  enterBtn.addEventListener("click", function () {
    enterBtn.style.display = "none";
    form.classList.add("open");
    input.focus();
  });

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var pw = input.value;
    if (!pw) return;
    msg.textContent = "unlocking...";
    stretch(pw).then(function (raw) {
      return decrypt(raw, CONTENT).then(function (config) {
        msg.textContent = "";
        unlock(raw, config);
      }, function () { msg.textContent = "wrong password - try again"; input.select(); });
    });
  });

  document.querySelectorAll(".topnav a").forEach(function (a) {
    a.addEventListener("click", function () { show(a.dataset.view); });
  });

  var saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    decrypt(unb64(saved), CONTENT).then(function (config) { unlock(unb64(saved), config); }, function () {
      try { sessionStorage.removeItem(KEY); } catch (e) {}
    });
  }
})();
</script>
</body>
</html>
